<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docsmith Mermaid HTML labels smoke</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}</style></head>
<body><div id="mount"></div>
<script>
const source = `# Mermaid HTML 标签回归

\`\`\`mermaid
flowchart LR
    R1["<b>研发</b>"] --> P1["§3 状态机<br/>§5 功能域<br/>§7 数据契约<br/>§8 异常"]
    R2["<b>测试</b>"] --> P2["§4 门禁<br/>§8 异常矩阵<br/>§10 验收标准<br/>§11 埋点"]
    R3["<b>算法</b>"] --> P3["§5.3 选址<br/>§5.4 偏移<br/>§7 契约"]
    R4["<b>业务方</b>"] --> P4["§2 用户任务<br/>§5 功能域<br/>§10 验收"]
    R5["<b>新任 PM</b>"] --> P5["全文 + 配套学习材料"]
    style R5 fill:#e8f4ff,stroke:#39c
\`\`\``;
const mount = document.querySelector('#mount');
const fail = (message) => { window.__htmlLabelsSmoke={error:String(message)}; document.body.dataset.rendered='error'; document.title=String(message); };
const frame = document.createElement('iframe'); frame.id='workspace'; frame.src='../src/views/markdown/index.html';
frame.addEventListener('load', () => {
  const win=frame.contentWindow, doc=frame.contentDocument, started=Date.now();
  (function wait(){
    if(win.MDW&&win.DocsmithDiagrams){ run(); return; }
    if(Date.now()-started>15000) return fail('工作台没有启动');
    setTimeout(wait,60);
  })();
  async function run(){
    try {
      win.MDW.setText(source);
      await win.MDW.whenDiagramsReady({timeout:30000,requireSuccess:true});
      const block=doc.querySelector('.diagram-block'), svg=block&&block.querySelector('.mm-stage > svg');
      if(!svg) throw new Error('精确样例没有生成图表');
      const labels=[...svg.querySelectorAll('.node > .label')];
      const bold=[...svg.querySelectorAll('.node > .label tspan[font-weight="700"]')];
      const boldLabels=labels.filter((label)=>label.querySelector('tspan[font-weight="700"]'));
      const rows=[...svg.querySelectorAll('.node > .label tspan.text-outer-tspan.row')];
      if(labels.length!==10) throw new Error('节点标签数量错误：'+labels.length);
      if(boldLabels.length!==5) throw new Error('节点加粗没有完整保留：'+boldLabels.length);
      if(rows.length!==20) throw new Error('节点换行没有完整保留：'+rows.length);
      if(!bold.length||!bold.every((node)=>Number.parseInt(win.getComputedStyle(node).fontWeight,10)>=600)) throw new Error('节点加粗样式没有生效');
      if(!['研发','测试','算法','业务方','新任 PM'].every((text)=>svg.textContent.includes(text))) throw new Error('节点文本丢失');
      const nodes=[...svg.querySelectorAll('.node')];
      const rightColumn=['P1','P2','P3','P4','P5'].map((id)=>nodes.find((node)=>node.id.includes('-flowchart-'+id+'-')));
      if(nodes.length!==10||rightColumn.some((node)=>!node)) throw new Error('精确 LR 图结构不完整');
      const vb=svg.viewBox.baseVal,bb=svg.getBBox(),eps=2;
      if(bb.x<vb.x-eps||bb.y<vb.y-eps||bb.x+bb.width>vb.x+vb.width+eps||bb.y+bb.height>vb.y+vb.height+eps) throw new Error('精确 LR 图内容超出自身 viewBox');
      const vp=block.querySelector('.mm-viewport'),vr=vp.getBoundingClientRect();
      rightColumn.forEach((node,index)=>{const r=node.getBoundingClientRect();if(r.left<vr.left-1.2||r.right>vr.right+1.2||r.top<vr.top-1.2||r.bottom>vr.bottom+1.2) throw new Error('右列 P'+(index+1)+' 被画布裁剪');});
      const r5=nodes.find((node)=>node.id.includes('-flowchart-R5-')),shape=r5&&r5.querySelector('rect,polygon,path'),style=shape&&win.getComputedStyle(shape);
      if(!style||style.fill!=='rgb(232, 244, 255)'||style.stroke!=='rgb(51, 153, 204)') throw new Error('R5 作者配色丢失：'+(style&&style.fill)+' / '+(style&&style.stroke));

      const html=await win.MDW.buildStandaloneHtml();
      const exported=new win.DOMParser().parseFromString(html,'text/html');
      const exportedLabels=[...exported.querySelectorAll('.node > .label')];
      if(exportedLabels.filter((label)=>label.querySelector('tspan[font-weight="700"]')).length!==5||exported.querySelectorAll('.node > .label tspan.text-outer-tspan.row').length!==20) throw new Error('独立 HTML 没有保留节点富文本');

      const result={ready:true,official:win.DocsmithDiagrams.hasOfficialMermaid,labels:labels.length,boldLabels:boldLabels.length,rows:rows.length,nodes:nodes.length,rightColumnVisible:true,viewBoxContainsContent:true,r5Style:true,standaloneBoldLabels:5};
      window.__htmlLabelsSmoke=result; document.body.dataset.rendered='true'; document.title=JSON.stringify(result);
    } catch(error) { fail(error.message); }
  }
});
mount.append(frame);
</script></body></html>
